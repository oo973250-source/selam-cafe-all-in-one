name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server files
        run: |
          for f in $(find server -name '*.js' -not -path 'server/node_modules/*'); do
            node --check "$f"
          done

      - name: Admin miniapp auth regression test
        run: npm run test:admin-auth
