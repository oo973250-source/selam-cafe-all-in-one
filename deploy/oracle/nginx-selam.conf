# Selam Cafe — nginx reverse proxy
# Installed to /etc/nginx/sites-available/selam-cafe by deploy/oracle/setup-server.sh
# After `sudo certbot --nginx -d yourdomain.com`, certbot rewrites this file to
# add the HTTPS server blocks automatically — do not edit manually afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # certbot replaces this with your real domain

    # Telegram Mini Apps upload logos etc. — allow reasonable request sizes
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Real client IP for the order-flood limiter and geo cache
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Socket.io / websocket support (live admin order queue)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
